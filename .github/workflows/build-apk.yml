name: Build Pulse Studio APK
on:
  push:
    branches: [serum-pocket-android-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install MP3 encoder
        run: |
          npm install --prefix /tmp/pulse-libs lamejs@1.2.1
          cp /tmp/pulse-libs/node_modules/lamejs/lame.all.js app/src/main/assets/lame.all.js
          test -f /tmp/pulse-libs/node_modules/lamejs/LICENSE && cp /tmp/pulse-libs/node_modules/lamejs/LICENSE app/src/main/assets/LAMEJS-LICENSE.txt || true
      - name: Bundle public Serum C64 comparison recording
        run: |
          curl -fLsS --retry 5 --retry-all-errors --connect-timeout 15 \
            "https://raw.githubusercontent.com/btesser/serum2vital/gh-pages/factory-leads/LD%20C64%20Lead%20%5BAS%5D%20-%20serum.mp3" \
            -o app/src/main/assets/LD_C64_Original_Serum.mp3
          test "$(wc -c < app/src/main/assets/LD_C64_Original_Serum.mp3)" -eq 121251
          sha256sum app/src/main/assets/LD_C64_Original_Serum.mp3
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes2.dex|assets/app.js|assets/index.html|assets/lame.all.js|assets/LD_C64_Original_Serum.mp3'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android device smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.pocketserum.studio/.MainActivity --ez smokeTest true
            sleep 42
            adb shell screencap -p /sdcard/pulse-launch.png
            adb pull /sdcard/pulse-launch.png pulse-launch.png
            adb logcat -d -v time -s PulseStudio:I AndroidRuntime:E chromium:E > pulse-logcat.txt
            cat pulse-logcat.txt | tail -75
            grep -q 'STARTUP TEST:' pulse-logcat.txt
            grep -q 'SMOKE_UI_OK' pulse-logcat.txt
            grep -q 'SMOKE_AUDIO_MEAN' pulse-logcat.txt
            grep -q 'SMOKE_EXPORT' pulse-logcat.txt
            grep -q 'REFERENCE_ASSET' pulse-logcat.txt
            grep -q 'REFERENCE_READY' pulse-logcat.txt
            grep -q 'SMOKE_REFERENCE_MEAN' pulse-logcat.txt
            if grep -E 'SMOKE_AUDIO_FAIL|SMOKE_REFERENCE_FAIL|FATAL EXCEPTION' pulse-logcat.txt; then exit 1; fi
            awk '/SMOKE_AUDIO_MEAN /{sub(/.*SMOKE_AUDIO_MEAN /, ""); if($1+0>0.000001)ok=1} END{exit !ok}' pulse-logcat.txt
            awk '/SMOKE_REFERENCE_MEAN /{sub(/.*SMOKE_REFERENCE_MEAN /, ""); if($1+0>0.0001)ok=1} END{exit !ok}' pulse-logcat.txt
      - name: Upload launch verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PulseStudio-Launch-Test
          path: |
            pulse-launch.png
            pulse-logcat.txt
          if-no-files-found: ignore
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseStudio-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
