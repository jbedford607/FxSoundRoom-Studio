name: Build Pulse Studio APK
on:
  push:
    branches: [serum-pocket-android-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install MP3 encoder
        run: |
          npm install --prefix /tmp/pulse-libs lamejs@1.2.1
          cp /tmp/pulse-libs/node_modules/lamejs/lame.all.js app/src/main/assets/lame.all.js
          test -f /tmp/pulse-libs/node_modules/lamejs/LICENSE && cp /tmp/pulse-libs/node_modules/lamejs/LICENSE app/src/main/assets/LAMEJS-LICENSE.txt || true
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseStudio-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
