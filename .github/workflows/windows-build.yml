name: Build FxSound Room Studio (Windows)

on:
  push:
    paths:
      - 'FxSoundRoom-Advanced-Correction-Source.zip'
      - '.github/workflows/windows-build.yml'
      - 'upgrade/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out build workspace
        uses: actions/checkout@v4

      - name: Unpack FxSound Room Studio source
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE 'FxSoundRoom-Advanced-Correction-Source.zip'
          if (-not (Test-Path -LiteralPath $archive)) {
            throw "Source archive is missing. Upload FxSoundRoom-Advanced-Correction-Source.zip to the repository root, then run this workflow again."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath source -Force
          foreach ($path in @('source/fxsound/Project/FxSound.sln', 'source/spatial/Studio.cpp', 'source/spatial/AdvancedCorrectionTest.cpp', 'source/JUCE/modules')) {
            if (-not (Test-Path $path)) { throw "Invalid archive: missing $path" }
          }
          Write-Host "Verified source archive and key files."

      - name: Apply native surround and reverb upgrades
        shell: pwsh
        run: |
          $encoded = (Get-Content -LiteralPath 'upgrade/spatial-upgrade-overlay.zip.b64' -Raw).Trim()
          $archive = Join-Path $env:RUNNER_TEMP 'spatial-upgrade.zip'
          [System.IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          Expand-Archive -LiteralPath $archive -DestinationPath 'overlay' -Force
          Copy-Item 'overlay/spatial/AdvancedSpatial.h' 'source/spatial/AdvancedSpatial.h'
          Copy-Item 'overlay/spatial/AdvancedSpatialTest.cpp' 'source/spatial/AdvancedSpatialTest.cpp'
          & git apply --check --directory=source 'overlay/upgrade/spatial-upgrade.patch'
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade patch does not match uploaded source.' }
          & git apply --directory=source 'overlay/upgrade/spatial-upgrade.patch'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to apply upgrade patch.' }
          if (-not (Select-String -Path 'source/spatial/Studio.cpp' -Pattern 'enhancedSpatial.process' -Quiet)) {
            throw 'Advanced DSP render path not connected.'
          }
          Write-Host 'Upgraded reverb, surround processor, GUI settings, and tests applied.'

      - name: Apply stereo rack and surround orbit effects
        shell: pwsh
        run: |
          Copy-Item 'upgrade/AdvancedEffects.h' 'source/spatial/AdvancedEffects.h'
          Copy-Item 'upgrade/AdvancedEffectsTest.cpp' 'source/spatial/AdvancedEffectsTest.cpp'
          python 'upgrade/ApplyStereoOrbit.py'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to integrate Stereo/7.1 DSP and GUI.' }
          if (-not (Select-String -Path 'source/spatial/Studio.cpp' -Pattern 'tab\("Stereo FX"' -Quiet)) {
            throw 'Stereo FX GUI tab was not integrated.'
          }
          if (-not (Select-String -Path 'source/spatial/Studio.cpp' -Pattern 'orbitRack.process' -Quiet)) {
            throw '7.1 orbit processor was not connected.'
          }

      - name: Fix Windows test stack allocation
        shell: pwsh
        run: |
          # The room studio test constructs a 1.1 MiB DSP Engine on the stack.
          # Windows executables default to a ~1 MiB stack, so this test crashes
          # before reaching any asserts. Place the TEST fixture in static storage.
          $testPath = 'source/spatial/RoomStudioEngineTest.cpp'
          $original = Get-Content -LiteralPath $testPath -Raw
          if (-not $original.Contains(' Engine e;resetControls();')) {
            throw 'Unexpected test source: cannot safely repair Windows stack overflow'
          }
          $patched = $original.Replace(' Engine e;resetControls();', ' static Engine e;resetControls();')
          Set-Content -LiteralPath $testPath -Value $patched -Encoding UTF8
          Write-Host 'RoomStudioEngineTest fixture now uses static storage.'

      - name: Run native DSP tests on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'test-bin' | Out-Null
          $tests = @('AdvancedCorrectionTest', 'AdvancedSpatialTest', 'AdvancedEffectsTest', 'RoomEngineTest', 'RoomStudioEngineTest', 'AnalysisTest', 'OutputLimiterTest')
          foreach ($test in $tests) {
            Write-Host "Compiling $test ..."
            & clang++ -O2 -std=c++17 "source/spatial/$test.cpp" 'source/spatial/biquad.cpp' 'source/spatial/biquad_matched.cpp' -o "test-bin/$test.exe"
            if ($LASTEXITCODE -ne 0) { throw "$test compilation failed" }
            Write-Host "Running $test ..."
            & "test-bin/$test.exe"
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
          }

      - name: Configure vendored JUCE modules
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'C:/JUCE' | Out-Null
          Copy-Item 'source/JUCE/modules' -Destination 'C:/JUCE/modules' -Recurse -Force
          # The recovered .vcxproj contains nine-level relative JUCE references from
          # its original build machine. Redirect those to the supplied JUCE files.
          $project = 'source/fxsound/Project/FxSound_App.vcxproj'
          $text = Get-Content -LiteralPath $project -Raw
          $text = $text -replace '(\.\.\\){3,}JUCE\\modules\\', 'C:\JUCE\modules\'
          Set-Content -LiteralPath $project -Value $text -Encoding UTF8
          if (-not (Test-Path 'C:/JUCE/modules/juce_core/juce_core.h')) {
            throw 'JUCE modules not installed into expected location.'
          }

      - name: Configure Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
          vs-version: '[17.0,18.0)'

      - name: Build native FxSound x64 app
        shell: pwsh
        run: |
          & msbuild 'source/fxsound/Project/FxSound.sln' /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "Visual Studio build failed. Inspect MSBuild errors above." }

      - name: Package compiled application artifact
        shell: pwsh
        run: |
          $app = Get-ChildItem 'source/fxsound/Project' -Filter 'FxSound.exe' -File -Recurse |
                 Where-Object { $_.FullName -match 'Release' } |
                 Select-Object -First 1
          if (-not $app) { throw 'MSBuild reported success but FxSound.exe was not found.' }
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item $app.FullName 'dist/FxSoundRoom.exe'
          Write-Host "Compiled application at dist/FxSoundRoom.exe"
          Write-Host 'IMPORTANT: This is NOT a driver installer. Existing signed FxSound virtual audio driver is required.'

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FxSoundRoom-Windows-x64
          path: dist/FxSoundRoom.exe
          if-no-files-found: error
